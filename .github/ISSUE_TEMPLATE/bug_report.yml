name: Bug report
description: Something looks wrong or petsitter misbehaves
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw. A screenshot helps.
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent involved
      multiple: true
      options: [Claude Code, Codex, opencode, None / not agent-specific]
  - type: input
    id: agent-version
    attributes:
      label: Agent version
      placeholder: e.g. claude 2.1.325, codex 0.172
  - type: textarea
    id: environment
    attributes:
      label: petsitter version and doctor
      description: Output of `petsitter --version` and `petsitter doctor`, plus your OS and terminal.
      render: text
    validations:
      required: true
  - type: markdown
    attributes:
      value: Please do not paste real transcripts or session files; they contain your prompts and code.
